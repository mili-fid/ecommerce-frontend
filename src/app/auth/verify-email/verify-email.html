<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-slate-900">
  <mat-card class="w-full max-w-md p-6 text-center">
    <mat-card-content class="pt-4 flex flex-col items-center gap-4">
      @if (state === 'loading') {
        <mat-spinner diameter="40"></mat-spinner>
        <p>{{ 'verify.loading' | t }}</p>
      } @else if (state === 'success') {
        <mat-icon class="!text-6xl !w-16 !h-16 text-green-500">check_circle</mat-icon>
        <h2 class="text-xl font-bold">{{ 'verify.success' | t }}</h2>
        <p class="text-gray-500 dark:text-gray-400">{{ 'verify.successSub' | t }}</p>
        <a mat-raised-button color="primary" routerLink="/login">{{ 'verify.goLogin' | t }}</a>
      } @else {
        <mat-icon class="!text-6xl !w-16 !h-16 text-red-500">error</mat-icon>
        <h2 class="text-xl font-bold">{{ 'verify.failed' | t }}</h2>
        <p class="text-gray-500 dark:text-gray-400">{{ 'verify.failedSub' | t }}</p>
        <a mat-raised-button color="primary" routerLink="/login">{{ 'verify.goLogin' | t }}</a>
      }
    </mat-card-content>
  </mat-card>
</div>
