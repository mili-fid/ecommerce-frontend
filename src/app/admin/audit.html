<h1 class="text-3xl font-bold mb-2">{{ 'admin.auditTitle' | t }}</h1>
<p class="text-gray-500 dark:text-gray-400 mb-6">{{ 'admin.auditSub' | t }}</p>

<mat-table [dataSource]="entries" class="w-full shadow rounded">
  <ng-container matColumnDef="date">
    <mat-header-cell *matHeaderCellDef>{{ 'admin.when' | t }}</mat-header-cell>
    <mat-cell *matCellDef="let e" class="text-sm">{{ e.createdAt | date: 'short' }}</mat-cell>
  </ng-container>
  <ng-container matColumnDef="admin">
    <mat-header-cell *matHeaderCellDef>{{ 'admin.admin' | t }}</mat-header-cell>
    <mat-cell *matCellDef="let e">{{ e.admin?.firstName }} {{ e.admin?.lastName }}</mat-cell>
  </ng-container>
  <ng-container matColumnDef="action">
    <mat-header-cell *matHeaderCellDef>{{ 'admin.action' | t }}</mat-header-cell>
    <mat-cell *matCellDef="let e">
      <span class="px-2 py-1 rounded text-xs font-bold bg-gray-100">{{ e.action }}</span>
    </mat-cell>
  </ng-container>
  <ng-container matColumnDef="details">
    <mat-header-cell *matHeaderCellDef>{{ 'admin.details' | t }}</mat-header-cell>
    <mat-cell *matCellDef="let e" class="text-sm text-gray-600 dark:text-gray-300">{{ e.details }}</mat-cell>
  </ng-container>
  <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
  <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
</mat-table>
